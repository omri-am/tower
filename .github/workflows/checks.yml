name: checks

on:
  pull_request:

jobs:
  checks:
    # The suite must pass on both macOS (BSD tools) and Linux (GNU tools).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Default fetch-depth is 1 (a single commit). The changelog check
          # needs the merge base between the PR branch and its target, so the
          # checkout needs full history, not just the tip.
          fetch-depth: 0

      - name: Run test suite
        run: bash tests/run.sh

      - name: Check for a changelog entry
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/tower-changelog-check "origin/$BASE_REF"
